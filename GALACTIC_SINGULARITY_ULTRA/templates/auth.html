<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 {{ 'Registrieren' if mode == 'register' else 'Login' }} - Galaktische Singularität</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <span class="auth-icon">🌌</span>
                <h1>{{ 'Neues Portal erstellen' if mode == 'register' else 'Portal betreten' }}</h1>
            </div>

            {% if error %}
            <div class="auth-error">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <form method="POST" class="auth-form">
                <div class="input-group">
                    <label for="username">👤 Kosmischer Name</label>
                    <input type="text" id="username" name="username" required
                           placeholder="Dein Reisender-Name" autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">🔐 Geheimcode</label>
                    <input type="password" id="password" name="password" required
                           placeholder="Dein geheimer Schlüssel" autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}">
                </div>

                <button type="submit" class="auth-submit">
                    {{ '✨ Portal erschaffen' if mode == 'register' else '🌟 Eintreten' }}
                </button>
            </form>

            <div class="auth-switch">
                {% if mode == 'register' %}
                    Bereits ein Portal? <a href="/login">Hier eintreten</a>
                {% else %}
                    Noch kein Portal? <a href="/register">Jetzt erschaffen</a>
                {% endif %}
            </div>

            <a href="/" class="back-link">← Zurück zur Singularität</a>
        </div>
    </div>
</body>
</html>
