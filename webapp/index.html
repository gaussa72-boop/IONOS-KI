<!DOCTYPE html>
<html>
<head>
    <title>Galactic AI – Urspirit System</title>
</head>
<body style="background:black;color:white;font-family:monospace">

<h1>⚡ Galactic AI – Urspirit Engine</h1>

<input id="input" placeholder="Frage an das Universum">
<button onclick="send()">Rufen</button>

<pre id="output"></pre>

<script>
async function send(){
    const prompt = document.getElementById("input").value;

    const res = await fetch("http://127.0.0.1:5000/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({prompt})
    });

    const data = await res.json();
    document.getElementById("output").innerText =
        JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
